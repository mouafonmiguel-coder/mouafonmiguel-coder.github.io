name: CV Rapide APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Installer les dependances
        run: npm install
        working-directory: cv-apk
      - name: Creer le projet Android
        run: npx cap add android
        working-directory: cv-apk
      - name: Generer les icones
        run: npx @capacitor/assets generate --android || true
        working-directory: cv-apk
      - name: Construire l APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
        working-directory: cv-apk
      - uses: actions/upload-artifact@v4
        with:
          name: CVRapide-APK
          path: cv-apk/android/app/build/outputs/apk/debug/app-debug.apk
