function photoPick(ev) {
  var f = ev.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    var img = new Image();
    img.onload = function () {
      var c = document.createElement('canvas');
      var s2 = Math.min(img.width, img.height);
      c.width = 300; c.height = 300;
      c.getContext('2d').drawImage(img, (img.width - s2) / 2, (img.height - s2) / 2, s2, s2, 0, 0, 300, 300);
      CV().photo = c.toDataURL('image/jpeg', 0.82);
      save(); toast(t().photoToast); render();
    };
    img.src = r.result;
  };
  r.readAsDataURL(f);
}

function renderPay() {
  var T = t();
  var h = '<div class="card"><h3>' + T.payT + '</h3>' +
    '<p class="hint" style="margin-bottom:10px">' + T.payList + '</p>' +
    '<div class="step"><div class="n">1</div><p>' + (FAPSHI_LINK ? T.payOnlineHint : T.step1) + '</p></div>';
  if (FAPSHI_LINK) {
    h += '<a href="' + FAPSHI_LINK + '" target="_blank" rel="noreferrer"><button class="big green" style="margin-top:0">' + T.payOnline + '</button></a>' +
      '<p class="hint" style="margin:8px 0">' + T.step1b + '</p>';
  }
  h += '<div class="rowbtn"><a href="tel:%23150%23"><button class="big gold">' + T.dial1 + '</button></a><a href="tel:*126%23"><button class="big gold">' + T.dial2 + '</button></a></div>' +
    '<div class="step" style="margin-top:14px"><div class="n">2</div><p>' + T.step2 + '</p></div>' +
    '<div class="step" style="margin-top:14px"><div class="n">3</div><p>' + T.step3 + '</p></div>' +
    '<input id="pPhone" inputmode="tel" placeholder="' + T.phPhone + '" value="' + esc(S.phone) + '">' +
    '<input id="pTxn" placeholder="' + T.phTxn + '" style="margin-top:8px">' +
    '<div class="err" id="pErr"></div>' +
    '<button class="big" onclick="activate()">' + T.actBtn + '</button>' +
    '<p class="hint" style="margin-top:8px">' + T.warn + '</p>' +
    '<p class="hint" style="margin-top:6px">' + T.help + '</p></div>';
  return h;
}
function activate() {
  var T = t();
  var ph = document.getElementById('pPhone').value.replace(/\D/g, '');
  var txn = document.getElementById('pTxn').value.trim();
  var errEl = document.getElementById('pErr'); errEl.textContent = '';
  if (ph.length < 9) { errEl.textContent = T.errPhone; return; }
  if (txn.replace(/[^A-Za-z0-9]/g, '').length < 8) { errEl.textContent = T.errTxn; return; }
  S.phone = ph; S.paidUntil = Date.now() + 365 * 86400000; S.wasPaid = true; save();
  regSend('📄 CV PDF 1000F/an | tel: ' + ph + ' | ID transaction: ' + txn);
  toast(T.actToast);
  view = 'prev'; window.scrollTo(0, 0); render();
  setTimeout(function () { window.print(); }, 900);
}

function render() {
  var T = t();
  document.getElementById('lngBtn').textContent = T.lngBtn;
  document.getElementById('tabListL').textContent = T.tabList;
  document.getElementById('tabFormL').textContent = T.tabForm;
  document.getElementById('tabPrevL').textContent = T.tabPrev;
  var warn = '';
  if (isPaid() && daysLeft() <= 3) warn = '<div class="card noprint" style="background:#fff7e6;border:2px solid #d99a06"><p style="font-weight:800;color:#8a5a00;font-size:.9rem;line-height:1.5">' + T.expSoon(daysLeft()) + '</p></div>';
  else if (!isPaid() && S.wasPaid) warn = '<div class="card noprint" style="background:#fdecea;border:2px solid #b42318"><p style="font-weight:800;color:#b42318;font-size:.9rem;line-height:1.5">' + T.expEnd + '</p></div>';
  if (view === 'home') app.innerHTML = warn + renderHome();
  else if (view === 'list') app.innerHTML = warn + renderList();
  else if (view === 'form') app.innerHTML = warn + renderForm();
  else if (view === 'prev') app.innerHTML = warn + renderPrev();
  else app.innerHTML = warn + renderPay();
  document.getElementById('tabList').className = view === 'list' ? 'on' : '';
  document.getElementById('tabForm').className = view === 'form' ? 'on' : '';
  document.getElementById('tabPrev').className = (view === 'prev' || view === 'pay') ? 'on' : '';
}
// ---------- VERIFICATEUR DE MISE A JOUR (LIEN + APK) ----------
var APP_VERSION = 16;
var VERSION_URL = 'https://mouafonmiguel-coder.github.io/cv/version.json';
var APK_URL = 'https://mouafonmiguel-coder.github.io/cv-apk/CVRapide.apk';
var IS_APK = !!window.Capacitor;
function showUpdate() {
  if (document.getElementById('updBar')) return;
  var T = t();
  var d = document.createElement('div');
  d.id = 'updBar'; d.className = 'updbar noprint';
  d.innerHTML = T.updMsg + (IS_APK
    ? ' <a href="' + APK_URL + '">📲 ' + T.updApk + '</a>'
    : ' <button onclick="location.reload()">🔄 ' + T.updWeb + '</button>');
  document.body.insertBefore(d, document.body.firstChild);
}
function checkUpdate() {
  try {
    fetch(VERSION_URL + '?v=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j && j.version > APP_VERSION) showUpdate(); })
      .catch(function () {});
  } catch (e) {}
}
checkUpdate();
setInterval(checkUpdate, 3600000);

render();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
}
</script>
