<style>

  .hero { background: linear-gradient(135deg,#0b5e55,#128a7d); color: #fff; border-radius: 18px; padding: 22px 18px; text-align: center; margin-bottom: 14px; }

  button.gold { background: #d99a06; } button.ghost { background: #fff; color: #0b5e55; border: 2px solid #0b5e55; } button.green { background: #1a7f37; }

  .step { display: flex; gap: 10px; margin-bottom: 12px; }
  .step .n { background: #0b5e55; color: #fff; min-width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; }
  .step p { font-size: .9rem; line-height: 1.5; }
  .rowbtn { display: flex; gap: 8px; } .rowbtn button, .rowbtn a { flex: 1; } a { text-decoration: none; }
  .badge { background: linear-gradient(135deg,#d99a06,#ffd54f); color: #4a3500; border-radius: 14px; padding: 12px; text-align: center; font-weight: 900; margin-bottom: 12px; cursor: pointer; }
  .toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: #15302b; color: #fff; padding: 11px 18px; border-radius: 999px; font-size: .88rem; font-weight: 700; z-index: 99; }
  .tplpick { display: flex; gap: 8px; margin-top: 8px; }

  .tplpick div.on { border-color: #0b5e55; background: #e7f3f1; }

  /* ---------- LE CV ---------- */
  .cvpage { background: #fff; width: 100%; max-width: 760px; margin: 0 auto; box-shadow: 0 4px 18px rgba(0,0,0,.14); position: relative; overflow: hidden; }
  .cvin { padding: 34px 38px; }

  .cvhead .cont { font-size: .8rem; color: #444; margin-top: 7px; line-height: 1.5; }
  .cvsec { margin-bottom: 14px; }
  .cvsec h2 { font-size: .95rem; color: #fff; background: var(--ac); display: inline-block; padding: 4px 14px; border-radius: 4px; margin-bottom: 8px; letter-spacing: .5px; }
  .cvsec p, .cvsec li { font-size: .86rem; line-height: 1.55; color: #222; }
  .cvitem { margin-bottom: 9px; }
  .cvitem .t1 { font-weight: 800; font-size: .9rem; color: #111; }
  .cvitem .t2 { font-size: .8rem; color: var(--ac); font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }

var S = {
  nom: '', poste: '', tel: '', email: '', ville: '', photo: '',
  profil: '', comp: '', langues: '', interets: '',
  exp: [{ poste: '', lieu: '', periode: '', desc: '' }],
  edu: [{ dip: '', ecole: '', annee: '' }],
  tpl: 'bleu', phone: '', premiumYear: 0, lang: 'fr'
};
try { var sv = localStorage.getItem('cv_state_v1'); if (sv) S = Object.assign(S, JSON.parse(sv)); } catch (e) {}
if (S.lang !== 'fr' && S.lang !== 'en') S.lang = 'fr';
function t() { return TR[S.lang]; }
function save() { try { localStorage.setItem('cv_state_v1', JSON.stringify(S)); } catch (e) {} }
function isPremium() { return S.premiumYear === new Date().getFullYear(); }
function toggleLang() { grabSafe(); S.lang = (S.lang === 'fr' ? 'en' : 'fr'); save(); render(); }

// Registre central de MIGUEL : chaque activation y est notee automatiquement
var CC_FORM = 'https://docs.google.com/forms/d/e/1FAIpQLSc8B9D32bIRco4H2AXkrnemNy_55aw8OoYg04ZVDsos1_u_Og/formResponse';
var CC_ENTRY = 'entry.1876005044';
function regSend(info) {
  try {
    var fd = new FormData();
    fd.append(CC_ENTRY, info + ' | ' + new Date().toLocaleString('fr-FR'));
    fetch(CC_FORM, { method: 'POST', mode: 'no-cors', body: fd }).catch(function () {});
  } catch (e) {}
}

var app = document.getElementById('app');
function toast(m) {
  var el = document.createElement('div'); el.className = 'toast'; el.textContent = m;
  document.body.appendChild(el); setTimeout(function () { el.remove(); }, 3200);
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
function nl(s) { return esc(s).replace(/\n/g, '<br>'); }

var view = 'form';
function go(v) { grabSafe(); view = v; window.scrollTo(0, 0); render(); }

function F(id) { var el = document.getElementById(id); return el ? el.value : ''; }
function grab() {
  S.nom = F('f_nom'); S.poste = F('f_poste'); S.tel = F('f_tel'); S.email = F('f_email');
  S.ville = F('f_ville'); S.profil = F('f_profil'); S.comp = F('f_comp');
  S.langues = F('f_lang'); S.interets = F('f_int');
  S.exp = S.exp.map(function (x, i) {
    return { poste: F('e_poste' + i), lieu: F('e_lieu' + i), periode: F('e_per' + i), desc: F('e_desc' + i) };
  });
  S.edu = S.edu.map(function (x, i) {
    return { dip: F('d_dip' + i), ecole: F('d_eco' + i), annee: F('d_an' + i) };
  });
  save();
}
function grabSafe() { if (view === 'form' && document.getElementById('f_nom')) grab(); }
function addExp() { grab(); S.exp.push({ poste: '', lieu: '', periode: '', desc: '' }); save(); render(); }
function rmExp(i) { grab(); S.exp.splice(i, 1); if (!S.exp.length) S.exp.push({ poste: '', lieu: '', periode: '', desc: '' }); save(); render(); }
function addEdu() { grab(); S.edu.push({ dip: '', ecole: '', annee: '' }); save(); render(); }
function rmEdu(i) { grab(); S.edu.splice(i, 1); if (!S.edu.length) S.edu.push({ dip: '', ecole: '', annee: '' }); save(); render(); }

function photoPick(ev) {
  var f = ev.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    var img = new Image();
    img.onload = function () {
      var c = document.createElement('canvas');
      var s2 = Math.min(img.width, img.height);
      c.width = 300; c.height = 300;
      c.getContext('2d').drawImage(img, (img.width - s2) / 2, (img.height - s2) / 2, s2, s2, 0, 0, 300, 300);
      S.photo = c.toDataURL('image/jpeg', 0.82);
      save(); toast(t().photoToast); render();
    };
    img.src = r.result;
  };
  r.readAsDataURL(f);
}

function setTpl(tp, locked) {
  if (locked && !isPremium()) { go('premium'); toast(t().lockToast); return; }
  grabSafe(); S.tpl = tp; save(); render();
}

function renderForm() {
  var T = t();

  h += '<div class="card"><h3>' + T.infoT + '</h3>' +

    '<label>' + T.lPoste + '</label><input id="f_poste" value="' + esc(S.poste) + '" placeholder="' + T.pPoste + '">' +
    '<label>' + T.lTel + '</label><input id="f_tel" inputmode="tel" value="' + esc(S.tel) + '" placeholder="6XX XXX XXX">' +
    '<label>' + T.lEmail + '</label><input id="f_email" value="' + esc(S.email) + '" placeholder="exemple@gmail.com">' +
    '<label>' + T.lVille + '</label><input id="f_ville" value="' + esc(S.ville) + '" placeholder="' + T.pVille + '">' +
    '<label>' + T.lPhoto + '</label><input type="file" accept="image/*" onchange="photoPick(event)">' +
    (S.photo ? '<p class="hint">' + T.photoOk + '</p>' : '') + '</div>';
  h += '<div class="card"><h3>' + T.profilT + '</h3>' +
    '<textarea id="f_profil" placeholder="' + T.pProfil + '">' + esc(S.profil) + '</textarea></div>';
  h += '<div class="card"><h3>' + T.expT + '</h3>';
  S.exp.forEach(function (x, i) {
    h += '<div class="expbox">' +
      '<label>' + T.lEposte + '</label><input id="e_poste' + i + '" value="' + esc(x.poste) + '" placeholder="' + T.pEposte + '">' +
      '<label>' + T.lElieu + '</label><input id="e_lieu' + i + '" value="' + esc(x.lieu) + '" placeholder="' + T.pElieu + '">' +
      '<label>' + T.lEper + '</label><input id="e_per' + i + '" value="' + esc(x.periode) + '" placeholder="' + T.pEper + '">' +
      '<label>' + T.lEdesc + '</label><textarea id="e_desc' + i + '" placeholder="' + T.pEdesc + '">' + esc(x.desc) + '</textarea>' +
      (S.exp.length > 1 ? '<button class="mini" style="margin-top:8px" onclick="rmExp(' + i + ')">' + T.rmExp + '</button>' : '') +
      '</div>';
  });
  h += '<button class="big ghost" onclick="addExp()">' + T.addExp + '</button></div>';
  h += '<div class="card"><h3>' + T.eduT + '</h3>';
  S.edu.forEach(function (x, i) {
    h += '<div class="expbox">' +
      '<label>' + T.lDip + '</label><input id="d_dip' + i + '" value="' + esc(x.dip) + '" placeholder="' + T.pDip + '">' +
      '<label>' + T.lEco + '</label><input id="d_eco' + i + '" value="' + esc(x.ecole) + '" placeholder="' + T.pEco + '">' +
      '<label>' + T.lAn + '</label><input id="d_an' + i + '" value="' + esc(x.annee) + '" placeholder="Ex. : 2021">' +
      (S.edu.length > 1 ? '<button class="mini" style="margin-top:8px" onclick="rmEdu(' + i + ')">' + T.rmEdu + '</button>' : '') +
      '</div>';
  });
  h += '<button class="big ghost" onclick="addEdu()">' + T.addEdu + '</button></div>';
  h += '<div class="card"><h3>' + T.skillT + '</h3>' +
    '<label>' + T.lComp + '</label><input id="f_comp" value="' + esc(S.comp) + '" placeholder="' + T.pComp + '">' +
    '<label>' + T.lLang + '</label><input id="f_lang" value="' + esc(S.langues) + '" placeholder="' + T.pLang + '">' +
    '<label>' + T.lInt + '</label><input id="f_int" value="' + esc(S.interets) + '" placeholder="' + T.pInt + '"></div>';
  h += '<button class="big" onclick="grab(); go(\'prev\')">' + T.seeCv + '</button>';
  return h;
}

function cvHTML() {
  var T = t();
  var premium = isPremium();
  var h = '<div class="cvpage cv-' + S.tpl + '"><div class="cvin">';
  h += '<div class="cvhead">';
  if (S.photo) h += '<img class="ph" src="' + S.photo + '">';
  h += '<div><h1>' + (esc(S.nom) || T.cvName) + '</h1>' +
    '<div class="job">' + esc(S.poste) + '</div>' +
    '<div class="cont">' + [S.tel ? '📞 ' + esc(S.tel) : '', S.email ? '✉️ ' + esc(S.email) : '', S.ville ? '📍 ' + esc(S.ville) : ''].filter(Boolean).join(' &nbsp; ') + '</div>' +
    '</div></div>';
  if (S.profil) h += '<div class="cvsec"><h2>' + T.cvProfil + '</h2><p>' + nl(S.profil) + '</p></div>';
  var exps = S.exp.filter(function (x) { return x.poste || x.lieu; });
  if (exps.length) {
    h += '<div class="cvsec"><h2>' + T.cvExp + '</h2>';
    exps.forEach(function (x) {
      h += '<div class="cvitem"><div class="t1">' + esc(x.poste) + '</div><div class="t2">' + esc(x.lieu) + (x.periode ? ' · ' + esc(x.periode) : '') + '</div>' + (x.desc ? '<p>' + nl(x.desc) + '</p>' : '') + '</div>';
    });
    h += '</div>';
  }
  var edus = S.edu.filter(function (x) { return x.dip || x.ecole; });
  if (edus.length) {
    h += '<div class="cvsec"><h2>' + T.cvEdu + '</h2>';
    edus.forEach(function (x) {
      h += '<div class="cvitem"><div class="t1">' + esc(x.dip) + '</div><div class="t2">' + esc(x.ecole) + (x.annee ? ' · ' + esc(x.annee) : '') + '</div></div>';
    });
    h += '</div>';
  }
  if (S.comp) {
    h += '<div class="cvsec"><h2>' + T.cvComp + '</h2><div class="chips">' +
      S.comp.split(',').map(function (c) { return c.trim(); }).filter(Boolean).map(function (c) { return '<span>' + esc(c) + '</span>'; }).join('') + '</div></div>';
  }
  if (S.langues) h += '<div class="cvsec"><h2>' + T.cvLang + '</h2><p>' + esc(S.langues) + '</p></div>';
  if (S.interets) h += '<div class="cvsec"><h2>' + T.cvInt + '</h2><p>' + esc(S.interets) + '</p></div>';
  h += '</div>';
  if (!premium) h += '<div class="wm">' + T.wm + '</div>';
  h += '</div>';
  return h;
}

function renderPrev() {
  var T = t();
  var h = '<div class="noprint">';
  h += '<div class="card"><h3>' + T.tplT + '</h3><div class="tplpick">' +
    '<div class="' + (S.tpl === 'bleu' ? 'on' : '') + '" style="color:#1b4e89" onclick="setTpl(\'bleu\', false)">🔵 ' + (S.lang === 'fr' ? 'BLEU' : 'BLUE') + '<br>' + T.free + '</div>' +
    '<div class="' + (S.tpl === 'vert' ? 'on' : '') + '" style="color:#0b5e55" onclick="setTpl(\'vert\', true)">🟢 ' + (S.lang === 'fr' ? 'VERT' : 'GREEN') + '<br>' + (isPremium() ? T.premOk : T.premLock) + '</div>' +
    '<div class="' + (S.tpl === 'bordeaux' ? 'on' : '') + '" style="color:#7a1f3d" onclick="setTpl(\'bordeaux\', true)">🔴 ' + (S.lang === 'fr' ? 'BORDEAUX' : 'BURGUNDY') + '<br>' + (isPremium() ? T.premOk : T.premLock) + '</div>' +
    '<div class="' + (S.tpl === 'noir' ? 'on' : '') + '" style="color:#222" onclick="setTpl(\'noir\', true)">⚫ ' + (S.lang === 'fr' ? 'NOIR' : 'BLACK') + '<br>' + (isPremium() ? T.premOk : T.premLock) + '</div>' +
    '</div>' +
    (!isPremium() ? '<p class="hint" style="margin-top:8px">' + T.tplHint + '</p>' : '') + '</div>';
  h += '</div>';
  h += cvHTML();
  h += '<div class="noprint">' +
    '<button class="big green" onclick="window.print()">' + T.dlBtn + '</button>' +
    '<p class="hint" style="text-align:center;margin-top:6px">' + T.dlHint + '</p>' +
    '<button class="big ghost" onclick="go(\'form\')">' + T.editBtn + '</button>' +
    (!isPremium() ? '<div class="badge" style="margin-top:12px" onclick="go(\'premium\')">' + T.badge + '</div>' : '') +
    '</div>';
  return h;
}

function renderPremium() {
  var T = t();
  var y = new Date().getFullYear();
  var h = '';
  if (isPremium()) {
    h += '<div class="card"><h3>' + T.premActiveT + '</h3><p class="hint">' + T.premActiveP(y) + '</p>' +
      '<button class="big" onclick="go(\'prev\')">' + T.seeMyCv + '</button></div>';
    return h;
  }
  h += '<div class="card"><h3>' + T.premT + '</h3>' +
    '<p class="hint" style="margin-bottom:10px">' + T.premList + '</p>' +
    '<div class="step"><div class="n">1</div><p>' + T.step1 + '</p></div>' +
    '<div class="rowbtn"><a href="tel:%23150%23"><button class="big gold">' + T.dial1 + '</button></a><a href="tel:*126%23"><button class="big gold">' + T.dial2 + '</button></a></div>' +
    '<div class="step" style="margin-top:14px"><div class="n">2</div><p>' + T.step2 + '</p></div>' +
    '<div class="step" style="margin-top:14px"><div class="n">3</div><p>' + T.step3 + '</p></div>' +
    '<input id="pPhone" inputmode="tel" placeholder="' + T.phPhone + '" value="' + esc(S.phone) + '">' +
    '<input id="pTxn" placeholder="' + T.phTxn + '" style="margin-top:8px">' +
    '<div class="err" id="pErr"></div>' +
    '<button class="big" onclick="activate()">' + T.actBtn + '</button>' +
    '<p class="hint" style="margin-top:8px">' + T.warn + '</p>' +
    '<p class="hint" style="margin-top:6px">' + T.help + '</p></div>';
  return h;
}
function activate() {
  var T = t();
  var ph = document.getElementById('pPhone').value.replace(/\D/g, '');
  var txn = document.getElementById('pTxn').value.trim();
  var errEl = document.getElementById('pErr'); errEl.textContent = '';
  if (ph.length < 9) { errEl.textContent = T.errPhone; return; }
  if (txn.replace(/[^A-Za-z0-9]/g, '').length < 8) { errEl.textContent = T.errTxn; return; }
  var y = new Date().getFullYear();
  S.phone = ph; S.premiumYear = y; save();
  regSend('📄 CV PREMIUM 1000F | tel: ' + ph + ' | ID transaction: ' + txn);
  toast(T.actToast);
  go('prev');
}

function render() {
  var T = t();
  document.getElementById('lngBtn').textContent = T.lngBtn;
  document.getElementById('topBtn').textContent = isPremium() ? T.premOn : T.premBtn;
  document.getElementById('tabFormL').textContent = T.tabForm;
  document.getElementById('tabPrevL').textContent = T.tabPrev;
  document.getElementById('tabPremL').textContent = T.tabPrem;
  if (view === 'form') app.innerHTML = renderForm();
  else if (view === 'prev') app.innerHTML = renderPrev();
  else app.innerHTML = renderPremium();
  document.getElementById('tabForm').className = view === 'form' ? 'on' : '';
  document.getElementById('tabPrev').className = view === 'prev' ? 'on' : '';
  document.getElementById('tabPrem').className = view === 'premium' ? 'on' : '';
}
render();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
}
</script>
</body>
</html>
