<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📄 CV RAPIDE — ton CV professionnel en 5 minutes</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<meta name="theme-color" content="#0b5e55">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: Arial, sans-serif; background: #eef6f4; color: #15302b; }
  .top { position: sticky; top: 0; z-index: 50; background: #0b5e55; color: #fff; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; }
  .brand { font-weight: 900; } .brand span { color: #ffd54f; }
  .top button { background: rgba(255,255,255,.14); color: #fff; border: 0; border-radius: 10px; padding: 7px 11px; font-weight: 700; font-size: .8rem; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 14px 14px 90px; }
  .hero { background: linear-gradient(135deg,#0b5e55,#128a7d); color: #fff; border-radius: 18px; padding: 22px 18px; text-align: center; margin-bottom: 14px; }
  .hero h1 { font-size: 1.3rem; margin-bottom: 8px; } .hero h1 b { color: #ffd54f; }
  .hero p { font-size: .88rem; opacity: .94; line-height: 1.5; }
  .card { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 10px rgba(11,94,85,.08); }
  .card h3 { color: #0b5e55; margin-bottom: 10px; font-size: 1rem; }
  label { font-size: .8rem; font-weight: 800; color: #0b5e55; display: block; margin-top: 8px; }
  input, textarea, select { width: 100%; border: 2px solid #cfe5e0; border-radius: 10px; padding: 11px; font-size: .95rem; margin-top: 4px; font-family: inherit; }
  textarea { min-height: 70px; resize: vertical; }
  button.big { display: block; width: 100%; background: #0b5e55; color: #fff; border: 0; border-radius: 14px; padding: 14px; font-size: 1rem; font-weight: 900; margin-top: 12px; cursor: pointer; }
  button.gold { background: #d99a06; } button.ghost { background: #fff; color: #0b5e55; border: 2px solid #0b5e55; } button.green { background: #1a7f37; }
  .mini { background: #fdecea; color: #b42318; border: 0; border-radius: 8px; padding: 6px 10px; font-weight: 800; font-size: .78rem; cursor: pointer; }
  .expbox { border: 2px dashed #cfe5e0; border-radius: 12px; padding: 10px; margin-top: 10px; }
  .tabs { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #cfe5e0; display: flex; z-index: 60; }
  .tabs button { flex: 1; background: none; border: 0; padding: 9px 4px 11px; font-size: .72rem; font-weight: 800; color: #7aa39b; cursor: pointer; }
  .tabs button .tic { display: block; font-size: 1.35rem; margin-bottom: 2px; }
  .tabs button.on { color: #0b5e55; }
  .hint { font-size: .82rem; color: #5a7a72; line-height: 1.5; }
  .err { color: #b42318; font-weight: 800; font-size: .9rem; min-height: 1.1em; }
  .step { display: flex; gap: 10px; margin-bottom: 12px; }
  .step .n { background: #0b5e55; color: #fff; min-width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; }
  .step p { font-size: .9rem; line-height: 1.5; }
  .rowbtn { display: flex; gap: 8px; } .rowbtn button, .rowbtn a { flex: 1; } a { text-decoration: none; }
  .badge { background: linear-gradient(135deg,#d99a06,#ffd54f); color: #4a3500; border-radius: 14px; padding: 12px; text-align: center; font-weight: 900; margin-bottom: 12px; cursor: pointer; }
  .toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: #15302b; color: #fff; padding: 11px 18px; border-radius: 999px; font-size: .88rem; font-weight: 700; z-index: 99; }
  .tplpick { display: flex; gap: 8px; margin-top: 8px; }
  .tplpick div { flex: 1; border: 3px solid #cfe5e0; border-radius: 10px; padding: 10px 4px; text-align: center; font-size: .75rem; font-weight: 800; cursor: pointer; }
  .tplpick div.on { border-color: #0b5e55; background: #e7f3f1; }

  /* ---------- LE CV ---------- */
  .cvpage { background: #fff; width: 100%; max-width: 760px; margin: 0 auto; box-shadow: 0 4px 18px rgba(0,0,0,.14); position: relative; overflow: hidden; }
  .cvin { padding: 34px 38px; }
  .cvhead { display: flex; gap: 18px; align-items: center; border-bottom: 4px solid var(--ac); padding-bottom: 16px; margin-bottom: 16px; }
  .cvhead .ph { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 4px solid var(--ac); flex-shrink: 0; }
  .cvhead h1 { font-size: 1.6rem; color: var(--ac); line-height: 1.15; }
  .cvhead .job { font-size: 1rem; font-weight: 700; color: #333; margin-top: 3px; }
  .cvhead .cont { font-size: .8rem; color: #444; margin-top: 7px; line-height: 1.5; }
  .cvsec { margin-bottom: 14px; }
  .cvsec h2 { font-size: .95rem; color: #fff; background: var(--ac); display: inline-block; padding: 4px 14px; border-radius: 4px; margin-bottom: 8px; letter-spacing: .5px; }
  .cvsec p, .cvsec li { font-size: .86rem; line-height: 1.55; color: #222; }
  .cvitem { margin-bottom: 9px; }
  .cvitem .t1 { font-weight: 800; font-size: .9rem; color: #111; }
  .cvitem .t2 { font-size: .8rem; color: var(--ac); font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { background: #f0f0f0; border-left: 4px solid var(--ac); padding: 4px 10px; border-radius: 4px; font-size: .8rem; font-weight: 700; }
  .wm { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: .72rem; color: #999; }
  .cv-bleu { --ac: #1b4e89; } .cv-vert { --ac: #0b5e55; } .cv-bordeaux { --ac: #7a1f3d; } .cv-noir { --ac: #222222; }

  @media print {
    body { background: #fff; }
    .top, .tabs, .noprint, .toast { display: none !important; }
    .wrap { padding: 0; max-width: none; }
    .cvpage { box-shadow: none; max-width: none; }
    @page { size: A4; margin: 0; }
  }
</style>
</head>
<body>
<div class="top noprint">
  <div class="brand">📄 CV <span>RAPIDE</span></div>
  <button onclick="go('premium')" id="topBtn">⭐ Premium</button>
</div>
<div class="wrap" id="app"></div>
<div class="tabs noprint">
  <button id="tabForm" onclick="go('form')"><span class="tic">✏️</span>Remplir</button>
  <button id="tabPrev" onclick="go('prev')"><span class="tic">👁️</span>Mon CV</button>
  <button id="tabPrem" onclick="go('premium')"><span class="tic">⭐</span>Premium</button>
</div>
<script>
var S = {
  nom: '', poste: '', tel: '', email: '', ville: '', photo: '',
  profil: '', comp: '', langues: '', interets: '',
  exp: [{ poste: '', lieu: '', periode: '', desc: '' }],
  edu: [{ dip: '', ecole: '', annee: '' }],
  tpl: 'bleu', phone: '', premiumYear: 0
};
try { var sv = localStorage.getItem('cv_state_v1'); if (sv) S = Object.assign(S, JSON.parse(sv)); } catch (e) {}
function save() { try { localStorage.setItem('cv_state_v1', JSON.stringify(S)); } catch (e) {} }
function isPremium() { return S.premiumYear === new Date().getFullYear(); }

// Registre central de MIGUEL : chaque activation y est notee automatiquement
var CC_FORM = 'https://docs.google.com/forms/d/e/1FAIpQLSc8B9D32bIRco4H2AXkrnemNy_55aw8OoYg04ZVDsos1_u_Og/formResponse';
var CC_ENTRY = 'entry.1876005044';
function regSend(info) {
  try {
    var fd = new FormData();
    fd.append(CC_ENTRY, info + ' | ' + new Date().toLocaleString('fr-FR'));
    fetch(CC_FORM, { method: 'POST', mode: 'no-cors', body: fd }).catch(function () {});
  } catch (e) {}
}

var app = document.getElementById('app');
function toast(m) {
  var t = document.createElement('div'); t.className = 'toast'; t.textContent = m;
  document.body.appendChild(t); setTimeout(function () { t.remove(); }, 3200);
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
function nl(s) { return esc(s).replace(/\n/g, '<br>'); }

var view = 'form';
function go(v) { view = v; window.scrollTo(0, 0); render(); }

function F(id) { var el = document.getElementById(id); return el ? el.value : ''; }
function grab() {
  S.nom = F('f_nom'); S.poste = F('f_poste'); S.tel = F('f_tel'); S.email = F('f_email');
  S.ville = F('f_ville'); S.profil = F('f_profil'); S.comp = F('f_comp');
  S.langues = F('f_lang'); S.interets = F('f_int');
  S.exp = S.exp.map(function (x, i) {
    return { poste: F('e_poste' + i), lieu: F('e_lieu' + i), periode: F('e_per' + i), desc: F('e_desc' + i) };
  });
  S.edu = S.edu.map(function (x, i) {
    return { dip: F('d_dip' + i), ecole: F('d_eco' + i), annee: F('d_an' + i) };
  });
  save();
}
function addExp() { grab(); S.exp.push({ poste: '', lieu: '', periode: '', desc: '' }); save(); render(); }
function rmExp(i) { grab(); S.exp.splice(i, 1); if (!S.exp.length) S.exp.push({ poste: '', lieu: '', periode: '', desc: '' }); save(); render(); }
function addEdu() { grab(); S.edu.push({ dip: '', ecole: '', annee: '' }); save(); render(); }
function rmEdu(i) { grab(); S.edu.splice(i, 1); if (!S.edu.length) S.edu.push({ dip: '', ecole: '', annee: '' }); save(); render(); }

function photoPick(ev) {
  var f = ev.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    var img = new Image();
    img.onload = function () {
      var c = document.createElement('canvas');
      var s2 = Math.min(img.width, img.height);
      c.width = 300; c.height = 300;
      c.getContext('2d').drawImage(img, (img.width - s2) / 2, (img.height - s2) / 2, s2, s2, 0, 0, 300, 300);
      S.photo = c.toDataURL('image/jpeg', 0.82);
      save(); toast('Photo ajoutée ✔'); render();
    };
    img.src = r.result;
  };
  r.readAsDataURL(f);
}

function setTpl(t, locked) {
  if (locked && !isPremium()) { go('premium'); toast('🔒 Ce modèle est réservé au Premium'); return; }
  grab(); S.tpl = t; save(); render();
}

function renderForm() {
  var h = '<div class="hero"><h1>Ton CV professionnel,<br><b>prêt en 5 minutes !</b></h1><p>Remplis les cases, choisis ton modèle, et télécharge ton CV en PDF — directement sur ton téléphone.</p></div>';
  h += '<div class="card"><h3>👤 Mes informations</h3>' +
    '<label>Nom complet</label><input id="f_nom" value="' + esc(S.nom) + '" placeholder="Ex. : NGONO Marie Claire">' +
    '<label>Poste recherché / métier</label><input id="f_poste" value="' + esc(S.poste) + '" placeholder="Ex. : Comptable / Électricien / Secrétaire">' +
    '<label>Téléphone</label><input id="f_tel" inputmode="tel" value="' + esc(S.tel) + '" placeholder="6XX XXX XXX">' +
    '<label>Email (facultatif)</label><input id="f_email" value="' + esc(S.email) + '" placeholder="exemple@gmail.com">' +
    '<label>Ville / Quartier</label><input id="f_ville" value="' + esc(S.ville) + '" placeholder="Ex. : Yaoundé, Awae">' +
    '<label>Photo (facultatif mais conseillé)</label><input type="file" accept="image/*" onchange="photoPick(event)">' +
    (S.photo ? '<p class="hint">✔ Photo enregistrée</p>' : '') + '</div>';
  h += '<div class="card"><h3>📝 Mon profil (2-3 phrases)</h3>' +
    '<textarea id="f_profil" placeholder="Ex. : Comptable rigoureuse avec 3 ans d\u2019expérience. Maîtrise de Excel et Sage. Disponible immédiatement.">' + esc(S.profil) + '</textarea></div>';
  h += '<div class="card"><h3>💼 Mes expériences</h3>';
  S.exp.forEach(function (x, i) {
    h += '<div class="expbox">' +
      '<label>Poste occupé</label><input id="e_poste' + i + '" value="' + esc(x.poste) + '" placeholder="Ex. : Caissière">' +
      '<label>Entreprise / Lieu</label><input id="e_lieu' + i + '" value="' + esc(x.lieu) + '" placeholder="Ex. : Boutique Chez Paul, Douala">' +
      '<label>Période</label><input id="e_per' + i + '" value="' + esc(x.periode) + '" placeholder="Ex. : 2022 – 2024">' +
      '<label>Ce que tu faisais (facultatif)</label><textarea id="e_desc' + i + '" placeholder="Ex. : Encaissement, gestion du stock, service client.">' + esc(x.desc) + '</textarea>' +
      (S.exp.length > 1 ? '<button class="mini" style="margin-top:8px" onclick="rmExp(' + i + ')">🗑 Retirer cette expérience</button>' : '') +
      '</div>';
  });
  h += '<button class="big ghost" onclick="addExp()">➕ Ajouter une expérience</button></div>';
  h += '<div class="card"><h3>🎓 Mes diplômes & formations</h3>';
  S.edu.forEach(function (x, i) {
    h += '<div class="expbox">' +
      '<label>Diplôme / Formation</label><input id="d_dip' + i + '" value="' + esc(x.dip) + '" placeholder="Ex. : BAC D / CAP Couture / Licence">' +
      '<label>École / Centre</label><input id="d_eco' + i + '" value="' + esc(x.ecole) + '" placeholder="Ex. : Lycée de Nkolbisson">' +
      '<label>Année</label><input id="d_an' + i + '" value="' + esc(x.annee) + '" placeholder="Ex. : 2021">' +
      (S.edu.length > 1 ? '<button class="mini" style="margin-top:8px" onclick="rmEdu(' + i + ')">🗑 Retirer</button>' : '') +
      '</div>';
  });
  h += '<button class="big ghost" onclick="addEdu()">➕ Ajouter un diplôme</button></div>';
  h += '<div class="card"><h3>⭐ Compétences, langues, centres d\u2019intérêt</h3>' +
    '<label>Compétences (sépare par des virgules)</label><input id="f_comp" value="' + esc(S.comp) + '" placeholder="Ex. : Excel, Caisse, Vente, Conduite">' +
    '<label>Langues</label><input id="f_lang" value="' + esc(S.langues) + '" placeholder="Ex. : Français (courant), Anglais (moyen)">' +
    '<label>Centres d\u2019intérêt (facultatif)</label><input id="f_int" value="' + esc(S.interets) + '" placeholder="Ex. : Football, lecture, musique"></div>';
  h += '<button class="big" onclick="grab(); go(\'prev\')">👁️ VOIR MON CV ➜</button>';
  return h;
}

function cvHTML() {
  var premium = isPremium();
  var h = '<div class="cvpage cv-' + S.tpl + '"><div class="cvin">';
  h += '<div class="cvhead">';
  if (S.photo) h += '<img class="ph" src="' + S.photo + '">';
  h += '<div><h1>' + (esc(S.nom) || 'TON NOM ICI') + '</h1>' +
    '<div class="job">' + esc(S.poste) + '</div>' +
    '<div class="cont">' + [S.tel ? '📞 ' + esc(S.tel) : '', S.email ? '✉️ ' + esc(S.email) : '', S.ville ? '📍 ' + esc(S.ville) : ''].filter(Boolean).join(' &nbsp; ') + '</div>' +
    '</div></div>';
  if (S.profil) h += '<div class="cvsec"><h2>PROFIL</h2><p>' + nl(S.profil) + '</p></div>';
  var exps = S.exp.filter(function (x) { return x.poste || x.lieu; });
  if (exps.length) {
    h += '<div class="cvsec"><h2>EXPÉRIENCE PROFESSIONNELLE</h2>';
    exps.forEach(function (x) {
      h += '<div class="cvitem"><div class="t1">' + esc(x.poste) + '</div><div class="t2">' + esc(x.lieu) + (x.periode ? ' · ' + esc(x.periode) : '') + '</div>' + (x.desc ? '<p>' + nl(x.desc) + '</p>' : '') + '</div>';
    });
    h += '</div>';
  }
  var edus = S.edu.filter(function (x) { return x.dip || x.ecole; });
  if (edus.length) {
    h += '<div class="cvsec"><h2>FORMATION</h2>';
    edus.forEach(function (x) {
      h += '<div class="cvitem"><div class="t1">' + esc(x.dip) + '</div><div class="t2">' + esc(x.ecole) + (x.annee ? ' · ' + esc(x.annee) : '') + '</div></div>';
    });
    h += '</div>';
  }
  if (S.comp) {
    h += '<div class="cvsec"><h2>COMPÉTENCES</h2><div class="chips">' +
      S.comp.split(',').map(function (c) { return c.trim(); }).filter(Boolean).map(function (c) { return '<span>' + esc(c) + '</span>'; }).join('') + '</div></div>';
  }
  if (S.langues) h += '<div class="cvsec"><h2>LANGUES</h2><p>' + esc(S.langues) + '</p></div>';
  if (S.interets) h += '<div class="cvsec"><h2>CENTRES D\u2019INTÉRÊT</h2><p>' + esc(S.interets) + '</p></div>';
  h += '</div>';
  if (!premium) h += '<div class="wm">CV créé gratuitement avec CV RAPIDE — WhatsApp 692 168 264</div>';
  h += '</div>';
  return h;
}

function renderPrev() {
  var h = '<div class="noprint">';
  h += '<div class="card"><h3>🎨 Choisis ton modèle</h3><div class="tplpick">' +
    '<div class="' + (S.tpl === 'bleu' ? 'on' : '') + '" style="color:#1b4e89" onclick="setTpl(\'bleu\', false)">🔵 BLEU<br>Gratuit</div>' +
    '<div class="' + (S.tpl === 'vert' ? 'on' : '') + '" style="color:#0b5e55" onclick="setTpl(\'vert\', true)">🟢 VERT<br>' + (isPremium() ? 'Premium ✓' : '🔒 Premium') + '</div>' +
    '<div class="' + (S.tpl === 'bordeaux' ? 'on' : '') + '" style="color:#7a1f3d" onclick="setTpl(\'bordeaux\', true)">🔴 BORDEAUX<br>' + (isPremium() ? 'Premium ✓' : '🔒 Premium') + '</div>' +
    '<div class="' + (S.tpl === 'noir' ? 'on' : '') + '" style="color:#222" onclick="setTpl(\'noir\', true)">⚫ NOIR<br>' + (isPremium() ? 'Premium ✓' : '🔒 Premium') + '</div>' +
    '</div>' +
    (!isPremium() ? '<p class="hint" style="margin-top:8px">⭐ Premium : modèles VERT, BORDEAUX et NOIR + <b>suppression du filigrane</b> en bas du CV.</p>' : '') + '</div>';
  h += '</div>';
  h += cvHTML();
  h += '<div class="noprint">' +
    '<button class="big green" onclick="window.print()">📄 TÉLÉCHARGER EN PDF</button>' +
    '<p class="hint" style="text-align:center;margin-top:6px">Dans la fenêtre qui s\u2019ouvre, choisis <b>« Enregistrer au format PDF »</b> — puis envoie ton CV sur WhatsApp ou par email !</p>' +
    '<button class="big ghost" onclick="go(\'form\')">✏️ Modifier mon CV</button>' +
    (!isPremium() ? '<div class="badge" style="margin-top:12px" onclick="go(\'premium\')">⭐ Enlever le filigrane + modèles PRO — appuie ici</div>' : '') +
    '</div>';
  return h;
}

function renderPremium() {
  var y = new Date().getFullYear();
  var h = '';
  if (isPremium()) {
    h += '<div class="card"><h3>⭐ Premium actif</h3><p class="hint">Ton Premium est actif pour toute l\u2019année ' + y + ' : filigrane supprimé + tous les modèles débloqués. Bon courage pour tes candidatures ! 💼</p>' +
      '<button class="big" onclick="go(\'prev\')">👁️ Voir mon CV</button></div>';
    return h;
  }
  h += '<div class="card"><h3>⭐ Premium — 1 000 F pour TOUTE l\u2019année</h3>' +
    '<p class="hint" style="margin-bottom:10px">✔ Filigrane supprimé (CV 100 % propre)<br>✔ Modèles VERT, BORDEAUX et NOIR débloqués<br>✔ Modifie et retélécharge ton CV autant de fois que tu veux, toute l\u2019année.</p>' +
    '<div class="step"><div class="n">1</div><p>Envoie <b>1 000 F</b> par Mobile Money à <b>MIGUEL MOUAFON</b> :<br>🟠 Orange Money : <b>692 168 264</b><br>🟡 MTN MoMo : <b>653 596 305</b></p></div>' +
    '<div class="rowbtn"><a href="tel:%23150%23"><button class="big gold">🟠 Composer #150#</button></a><a href="tel:*126%23"><button class="big gold">🟡 Composer *126#</button></a></div>' +
    '<div class="step" style="margin-top:14px"><div class="n">2</div><p>Après le paiement, tu reçois un <b>SMS de confirmation</b> avec l\u2019<b>ID de la transaction</b> (ex. : PP250118.1234.A12345 ou MP240118...).</p></div>' +
    '<div class="step" style="margin-top:14px"><div class="n">3</div><p>Entre ton numéro et cet ID ici → le Premium s\u2019active <b>immédiatement</b> :</p></div>' +
    '<input id="pPhone" inputmode="tel" placeholder="Ton numéro (ex. 6XXXXXXXX)" value="' + esc(S.phone) + '">' +
    '<input id="pTxn" placeholder="ID de la transaction (dans le SMS reçu)" style="margin-top:8px">' +
    '<div class="err" id="pErr"></div>' +
    '<button class="big" onclick="activate()">🔓 Activer mon Premium maintenant</button>' +
    '<p class="hint" style="margin-top:8px">⚠️ L\u2019ID doit être exact : chaque activation est vérifiée par MIGUEL avec les reçus Orange/MTN. Une fausse déclaration = Premium annulé.</p>' +
    '<p class="hint" style="margin-top:6px">Un souci ? Écris sur WhatsApp : <b>692 168 264</b></p></div>';
  return h;
}
function activate() {
  var ph = document.getElementById('pPhone').value.replace(/\D/g, '');
  var txn = document.getElementById('pTxn').value.trim();
  var errEl = document.getElementById('pErr'); errEl.textContent = '';
  if (ph.length < 9) { errEl.textContent = 'Entre ton numéro complet (9 chiffres).'; return; }
  if (txn.replace(/[^A-Za-z0-9]/g, '').length < 8) { errEl.textContent = 'Cet ID de transaction est trop court. Recopie exactement l\u2019ID du SMS de confirmation.'; return; }
  var y = new Date().getFullYear();
  S.phone = ph; S.premiumYear = y; save();
  regSend('📄 CV PREMIUM 1000F | tel: ' + ph + ' | ID transaction: ' + txn);
  toast('⭐ Premium activé ! Ton CV est maintenant 100 % propre.');
  go('prev');
}

function render() {
  document.getElementById('topBtn').textContent = isPremium() ? '⭐ Actif' : '⭐ Premium';
  if (view === 'form') app.innerHTML = renderForm();
  else if (view === 'prev') app.innerHTML = renderPrev();
  else app.innerHTML = renderPremium();
  document.getElementById('tabForm').className = view === 'form' ? 'on' : '';
  document.getElementById('tabPrev').className = view === 'prev' ? 'on' : '';
  document.getElementById('tabPrem').className = view === 'premium' ? 'on' : '';
}
render();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
}
</script>
</body>
</html>
