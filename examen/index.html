<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎓 RÉUSSIR SON EXAMEN</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<meta name="theme-color" content="#0d2b66">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: Arial, sans-serif; background: #eef2fb; color: #16213a; }
  .top { position: sticky; top: 0; z-index: 50; background: #0d2b66; color: #fff; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .brand { font-weight: 900; font-size: 1.02rem; }
  .brand span { color: #ffd54f; }
  .top button { background: rgba(255,255,255,.14); color: #fff; border: 0; border-radius: 10px; padding: 7px 11px; font-weight: 700; font-size: .8rem; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 14px 14px 90px; }
  .hero { background: linear-gradient(135deg, #0d2b66, #15418f); color: #fff; border-radius: 18px; padding: 24px 18px; text-align: center; margin-bottom: 14px; }
  .hero h1 { font-size: 1.45rem; margin-bottom: 8px; } .hero h1 b { color: #ffd54f; }
  .hero p { font-size: .9rem; opacity: .93; line-height: 1.5; }
  .count { background: #ffd54f; color: #0d2b66; border-radius: 14px; padding: 12px; text-align: center; font-weight: 900; margin-bottom: 14px; font-size: .95rem; }
  .card { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 10px rgba(13,43,102,.07); }
  .card h3 { color: #0d2b66; margin-bottom: 10px; font-size: 1.02rem; }
  .cat { font-weight: 900; color: #0d2b66; margin: 16px 2px 8px; font-size: 1.05rem; }
  .quiz { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 14px; padding: 13px 14px; margin-bottom: 9px; box-shadow: 0 2px 8px rgba(13,43,102,.06); cursor: pointer; }
  .quiz .ic { font-size: 1.7rem; }
  .quiz .ti { flex: 1; font-weight: 700; font-size: .92rem; }
  .quiz .sc { font-size: .78rem; color: #1a7f37; font-weight: 800; }
  .quiz .lock { font-size: 1.1rem; }
  .tagfree { background: #e7f6ec; color: #1a7f37; font-size: .68rem; font-weight: 900; padding: 3px 8px; border-radius: 999px; }
  .tagpro { background: #fff3d6; color: #8a6400; font-size: .68rem; font-weight: 900; padding: 3px 8px; border-radius: 999px; }
  button.big { display: block; width: 100%; background: #0d2b66; color: #fff; border: 0; border-radius: 14px; padding: 15px; font-size: 1rem; font-weight: 900; margin-top: 10px; cursor: pointer; }
  button.gold { background: #d99a06; }
  button.ghost { background: #fff; color: #0d2b66; border: 2px solid #0d2b66; }
  button.green { background: #1a7f37; }
  .back { background: none; border: 0; color: #0d2b66; font-weight: 800; font-size: .95rem; padding: 4px 0 12px; cursor: pointer; }
  /* quiz runner */
  .prog { height: 10px; background: #d7e0f2; border-radius: 999px; overflow: hidden; margin-bottom: 14px; }
  .prog > div { height: 100%; background: #0d2b66; transition: width .25s; }
  .qtxt { font-size: 1.05rem; font-weight: 800; line-height: 1.45; margin-bottom: 14px; }
  .opt { display: block; width: 100%; text-align: left; background: #f4f7ff; border: 2px solid #d7e0f2; border-radius: 12px; padding: 13px; font-size: .95rem; font-weight: 600; margin-bottom: 9px; cursor: pointer; }
  .opt.good { background: #e7f6ec; border-color: #1a7f37; color: #14532d; }
  .opt.bad { background: #fdecea; border-color: #b42318; color: #7a1410; }
  .exp { background: #fff8e1; border-left: 4px solid #d99a06; border-radius: 8px; padding: 11px; font-size: .88rem; line-height: 1.5; margin: 6px 0 4px; }
  .score { text-align: center; padding: 10px 0; }
  .score .n { font-size: 3rem; font-weight: 900; color: #0d2b66; }
  .hint { font-size: .84rem; color: #5a6880; line-height: 1.5; }
  input { width: 100%; border: 2px solid #d7e0f2; border-radius: 12px; padding: 13px; font-size: 1rem; margin: 6px 0; }
  .ok { color: #1a7f37; font-weight: 800; font-size: .9rem; }
  .err { color: #b42318; font-weight: 800; font-size: .9rem; min-height: 1.1em; }
  .step { display: flex; gap: 10px; margin-bottom: 12px; }
  .step .n { background: #0d2b66; color: #fff; min-width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; }
  .step p { font-size: .9rem; line-height: 1.5; }
  .rowbtn { display: flex; gap: 8px; }
  .rowbtn button, .rowbtn a { flex: 1; }
  a { text-decoration: none; }
  .badge { background: linear-gradient(135deg,#d99a06,#ffd54f); color: #4a3500; border-radius: 14px; padding: 12px; text-align: center; font-weight: 900; margin-bottom: 12px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #16213a; color: #fff; padding: 11px 18px; border-radius: 999px; font-size: .88rem; font-weight: 700; z-index: 99; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
</style>
</head>
<body>
<div class="top">
  <div class="brand">🎓 RÉUSSIR <span>SON EXAMEN</span></div>
  <button onclick="go('premium')" id="topBtn">⭐ Premium</button>
</div>
<div class="wrap" id="app"></div>
<script src="./questions.js"></script>
<script>
// ---------- etat local ----------
var S = { phone: '', premiumYear: 0, scores: {}, examDate: '', examName: '' };
try { var sv = localStorage.getItem('ex_state_v1'); if (sv) S = Object.assign(S, JSON.parse(sv)); } catch (e) {}
function save() { try { localStorage.setItem('ex_state_v1', JSON.stringify(S)); } catch (e) {} }
function isPremium() { return S.premiumYear === new Date().getFullYear(); }

var SECRET = 'EXAM-MIGUEL-2026-9c4b7e1a5d3f8b26';
async function makeCode(phone, year) {
  var enc = new TextEncoder();
  var key = await crypto.subtle.importKey('raw', enc.encode(SECRET), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  var sig = await crypto.subtle.sign('HMAC', key, enc.encode(phone + ':' + year));
  var hex = Array.from(new Uint8Array(sig)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  return String(parseInt(hex.slice(0, 12), 16) % 1000000).padStart(6, '0');
}

var app = document.getElementById('app');
function toast(m) {
  var t = document.createElement('div');
  t.className = 'toast'; t.textContent = m;
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 3200);
}
function esc(s) { return String(s).replace(/</g, '&lt;'); }

// ---------- vues ----------
var view = 'home', curQuiz = null, qIdx = 0, qGood = 0, answered = false;
function go(v, arg) {
  view = v;
  if (v === 'quiz') { curQuiz = arg; qIdx = 0; qGood = 0; answered = false; }
  window.scrollTo(0, 0);
  render();
}

function daysLeft() {
  if (!S.examDate) return null;
  var d = Math.ceil((new Date(S.examDate) - new Date()) / 86400000);
  return d;
}

function renderHome() {
  var h = '';
  h += '<div class="hero"><h1>Prépare ton examen,<br><b>réussis du premier coup !</b></h1>' +
       '<p>Des quiz type examen avec corrections expliquées — BEPC, Probatoire, BAC et grands concours. Ça marche même sans connexion.</p></div>';
  var dl = daysLeft();
  if (dl !== null) {
    h += '<div class="count" onclick="go(\'date\')">⏳ ' + (dl > 0 ? ('J−' + dl + ' avant ' + esc(S.examName || 'ton examen') + ' — chaque jour compte !') : 'C\u2019est le grand jour ou c\u2019est passé — courage ! 🙏') + '</div>';
  } else {
    h += '<div class="count" onclick="go(\'date\')">📅 Appuie ici pour mettre la date de TON examen (compte à rebours)</div>';
  }
  if (!isPremium()) {
    h += '<div class="badge" onclick="go(\'premium\')">⭐ Débloque TOUS les quiz — appuie ici</div>';
  } else {
    h += '<div class="badge">⭐ PREMIUM ACTIF — tous les quiz sont débloqués. Bonne révision !</div>';
  }
  var cats = [];
  QUIZ_DATA.forEach(function (z) { if (cats.indexOf(z.cat) < 0) cats.push(z.cat); });
  cats.forEach(function (c) {
    h += '<div class="cat">' + esc(c) + '</div>';
    QUIZ_DATA.filter(function (z) { return z.cat === c; }).forEach(function (z) {
      var unlocked = z.free || isPremium();
      var best = S.scores[z.id];
      h += '<div class="quiz" onclick="openQuiz(\'' + z.id + '\')">' +
           '<div class="ic">' + z.icon + '</div>' +
           '<div class="ti">' + esc(z.title) +
           (best !== undefined ? '<div class="sc">Meilleur score : ' + best + '/' + z.qs.length + '</div>' : '') +
           '</div>' +
           (unlocked ? '<span class="tagfree">' + (z.free ? 'GRATUIT' : 'PREMIUM ✓') + '</span>' : '<span class="tagpro">🔒 PREMIUM</span>') +
           '</div>';
    });
  });
  h += '<div class="card" style="margin-top:16px"><h3>📣 Partage avec tes camarades</h3>' +
       '<p class="hint">Plus vous révisez ensemble, plus vous réussissez ensemble !</p>' +
       '<a href="https://wa.me/?text=' + encodeURIComponent('🎓 Je révise mon examen avec cette application : quiz + corrections expliquées, même sans connexion ! Essaie : https://mouafonmiguel-coder.github.io/examen/') + '"><button class="big green">📲 Partager sur WhatsApp</button></a></div>';
  h += '<p class="hint" style="text-align:center;margin-top:10px">Des questions ? WhatsApp : <b>692 168 264</b></p>';
  return h;
}

function openQuiz(id) {
  var z = QUIZ_DATA.find(function (x) { return x.id === id; });
  if (!z) return;
  if (!z.free && !isPremium()) { go('premium'); toast('🔒 Ce quiz est réservé au Premium'); return; }
  go('quiz', z);
}

function renderQuiz() {
  var z = curQuiz, q = z.qs[qIdx];
  var h = '<button class="back" onclick="go(\'home\')">← Quitter le quiz</button>';
  h += '<div class="prog"><div style="width:' + Math.round(qIdx / z.qs.length * 100) + '%"></div></div>';
  h += '<div class="card"><div class="hint" style="margin-bottom:8px">' + z.icon + ' ' + esc(z.title) + ' — Question ' + (qIdx + 1) + '/' + z.qs.length + '</div>';
  h += '<div class="qtxt">' + esc(q.q) + '</div>';
  q.opts.forEach(function (o, i) {
    var cls = 'opt';
    if (answered) { if (i === q.ok) cls += ' good'; else if (i === window._chosen) cls += ' bad'; }
    h += '<button class="' + cls + '" onclick="answer(' + i + ')">' + 'ABCD'[i] + '. ' + esc(o) + '</button>';
  });
  if (answered) {
    h += '<div class="exp">💡 ' + esc(q.exp) + '</div>';
    h += '<button class="big" onclick="nextQ()">' + (qIdx + 1 < z.qs.length ? 'Question suivante ➜' : 'Voir mon score 🏁') + '</button>';
  }
  h += '</div>';
  return h;
}
function answer(i) {
  if (answered) return;
  answered = true; window._chosen = i;
  if (i === curQuiz.qs[qIdx].ok) qGood++;
  render();
}
function nextQ() {
  if (qIdx + 1 < curQuiz.qs.length) { qIdx++; answered = false; render(); window.scrollTo(0, 0); }
  else {
    var best = S.scores[curQuiz.id];
    if (best === undefined || qGood > best) { S.scores[curQuiz.id] = qGood; save(); }
    go('result');
  }
}
function renderResult() {
  var z = curQuiz, n = z.qs.length, p = qGood / n;
  var msg, em;
  if (p >= 0.8) { em = '🏆'; msg = 'Excellent ! Tu es prêt(e) pour ça. Continue comme ça !'; }
  else if (p >= 0.5) { em = '💪'; msg = 'Pas mal ! Relis les explications et refais le quiz pour viser le 100 %.'; }
  else { em = '📖'; msg = 'Courage ! Lis bien chaque explication — c\u2019est comme ça qu\u2019on progresse. Refais le quiz tout de suite.'; }
  var h = '<div class="card"><div class="score"><div style="font-size:3rem">' + em + '</div><div class="n">' + qGood + '/' + n + '</div><p class="hint">' + msg + '</p></div>' +
          '<button class="big" onclick="openQuiz(\'' + z.id + '\')">🔄 Refaire ce quiz</button>' +
          '<button class="big ghost" onclick="go(\'home\')">🏠 Retour aux quiz</button></div>';
  if (!isPremium()) h += '<div class="badge" onclick="go(\'premium\')">⭐ Débloque TOUS les quiz pour réviser à fond</div>';
  return h;
}

function renderDate() {
  var h = '<button class="back" onclick="go(\'home\')">← Retour</button>';
  h += '<div class="card"><h3>📅 La date de TON examen</h3>' +
       '<p class="hint">Mets le nom et la date : l\u2019application te montrera le compte à rebours chaque jour.</p>' +
       '<input id="exName" placeholder="Ex. : BEPC 2026, BAC D, Concours ENAM..." value="' + esc(S.examName) + '">' +
       '<input id="exDate" type="date" value="' + esc(S.examDate) + '">' +
       '<button class="big" onclick="saveDate()">✅ Enregistrer</button></div>';
  return h;
}
function saveDate() {
  S.examName = document.getElementById('exName').value.trim().slice(0, 40);
  S.examDate = document.getElementById('exDate').value;
  save(); toast('Enregistré ✔'); go('home');
}

function renderPremium() {
  var y = new Date().getFullYear();
  var h = '<button class="back" onclick="go(\'home\')">← Retour</button>';
  if (isPremium()) {
    h += '<div class="card"><h3>⭐ Premium actif</h3><p class="hint">Ton accès Premium est actif pour toute l\u2019année ' + y + '. Tous les quiz sont débloqués. Bonne révision ! 🎓</p>' +
         '<button class="big" onclick="go(\'home\')">🏠 Retour aux quiz</button></div>';
    return h;
  }
  h += '<div class="card"><h3>⭐ Passe en Premium — 1 000 F pour TOUTE l\u2019année</h3>' +
       '<p class="hint" style="margin-bottom:10px">Tous les quiz débloqués + les nouveaux quiz ajoutés pendant l\u2019année, jusqu\u2019à ton examen. Un seul paiement.</p>' +
       '<div class="step"><div class="n">1</div><p>Envoie <b>1 000 F</b> par Mobile Money à <b>MIGUEL MOUAFON</b> :<br>🟠 Orange Money : <b>692 168 264</b><br>🟡 MTN MoMo : <b>653 596 305</b></p></div>' +
       '<div class="rowbtn"><a href="tel:%23150%23"><button class="big gold">🟠 Composer #150#</button></a><a href="tel:*126%23"><button class="big gold">🟡 Composer *126#</button></a></div>' +
       '<div class="step" style="margin-top:14px"><div class="n">2</div><p>Envoie sur WhatsApp ton <b>numéro de téléphone</b> + l\u2019<b>ID de la transaction</b> (obligatoire) :</p></div>' +
       '<a href="https://wa.me/237692168264?text=' + encodeURIComponent('Bonjour MIGUEL ! Je veux le Premium RÉUSSIR SON EXAMEN (1 000 F). Mon numéro : ______ . ID de transaction : ______') + '"><button class="big green">📲 Envoyer sur WhatsApp</button></a>' +
       '<div class="step" style="margin-top:14px"><div class="n">3</div><p>Tu reçois un <b>code à 6 chiffres</b> → entre-le ici :</p></div>' +
       '<input id="pPhone" inputmode="tel" placeholder="Ton numéro (ex. 6XXXXXXXX)" value="' + esc(S.phone) + '">' +
       '<input id="pCode" inputmode="numeric" placeholder="Code à 6 chiffres">' +
       '<div class="err" id="pErr"></div>' +
       '<button class="big" onclick="activate()">🔓 Activer mon Premium</button></div>';
  return h;
}
async function activate() {
  var ph = document.getElementById('pPhone').value.replace(/\D/g, '');
  var code = document.getElementById('pCode').value.trim();
  var errEl = document.getElementById('pErr');
  errEl.textContent = '';
  if (ph.length < 9) { errEl.textContent = 'Entre ton numéro complet (9 chiffres).'; return; }
  var y = new Date().getFullYear();
  var good = await makeCode(ph, y);
  if (code === good) {
    S.phone = ph; S.premiumYear = y; save();
    toast('⭐ Premium activé ! Bonne révision 🎓');
    go('home');
  } else {
    errEl.textContent = 'Code incorrect. Vérifie le code reçu sur WhatsApp.';
  }
}

function render() {
  document.getElementById('topBtn').textContent = isPremium() ? '⭐ Actif' : '⭐ Premium';
  if (view === 'home') app.innerHTML = renderHome();
  else if (view === 'quiz') app.innerHTML = renderQuiz();
  else if (view === 'result') app.innerHTML = renderResult();
  else if (view === 'date') app.innerHTML = renderDate();
  else if (view === 'premium') app.innerHTML = renderPremium();
}
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
}
</script>
</body>
</html>
